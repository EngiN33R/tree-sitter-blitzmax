[package]
name = "tree-sitter-blitzmax"
description = "Case-insensitive Tree-sitter grammar for BlitzMax NG"
version = "0.1.1"
authors = ["Ilya Gavrikov"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "blitzmax"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/engin33r/tree-sitter-blitzmax"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
