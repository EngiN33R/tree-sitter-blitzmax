name: Publish package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    uses: tree-sitter/workflows/.github/workflows/release.yml@main
    with:
      # Release the committed parser; keep generation on the pinned local CLI.
      generate: false
      abi-version: 14
