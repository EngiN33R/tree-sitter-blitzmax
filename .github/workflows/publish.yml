name: Publish package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.25.10
      - run: tree-sitter generate --abi 14
      - run: git diff --exit-code -- src/
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
# Package-registry publication is intentionally not enabled.